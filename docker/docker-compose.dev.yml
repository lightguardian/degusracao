name: degusracao

services:
  app:
    build:
      context: .
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
      - "5173:5173"
    environment:
      SERVER_HOST: 0.0.0.0
      DUSK_DRIVER_URL: http://selenium:4444/wd/hub
    networks:
      default:
        aliases:
          - degusracao.test

  selenium:
    image: selenium/standalone-chromium:156.0
    shm_size: 2gb
